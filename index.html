<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTS Tariff Engine</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0d1117;color:#e6edf3;margin:0;}
header {background:#161b22;padding:18px;font-size:22px;text-align:center;border-bottom:1px solid #30363d;}

.tabs {display:flex;background:#161b22;border-bottom:1px solid #30363d;}
.tab {flex:1;padding:14px;text-align:center;cursor:pointer;color:#8b949e;}
.tab.active {color:white;border-bottom:2px solid #2ea043;}

.container {max-width:520px;margin:auto;padding:12px;}
.tab-content {display:none;}
.tab-content.active {display:block;}

.section {background:#161b22;border-radius:14px;padding:14px;margin-top:14px;}

input, select {
  width:100%;padding:11px;margin:6px 0;border-radius:10px;
  border:1px solid #30363d;background:#0d1117;color:white;
  font-size:16px;box-sizing:border-box;
}

.row {display:flex;gap:10px;}
.row > div {flex:1;}

button {
  padding:14px;border-radius:12px;border:none;
  background:#2ea043;color:white;font-size:16px;
  width:100%;margin-top:12px;
}

.result {margin-top:16px;background:#161b22;border-radius:14px;padding:15px;}
.big {font-size:26px;font-weight:bold;color:#3fb950;}

.item {padding:10px;border-bottom:1px solid #30363d;cursor:pointer;}
.item:hover {background:#21262d;}
</style>
</head>

<body>

<header>HTS Tariff Engine</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('hts')">HTS Lookup</div>
  <div class="tab" onclick="switchTab('products')">Current Products</div>
</div>

<div class="container">

<!-- HTS TAB -->
<div id="hts" class="tab-content active">

<div class="section">
<input id="search" placeholder="Enter HTS or description">
<button onclick="searchHTS()">Search</button>
<div id="results"></div>
</div>

<div class="section">
<div class="row">
  <input id="cost" type="number" placeholder="Unit Cost">
  <input id="units" type="text" placeholder="Units" oninput="formatUnits(this)">
</div>

<div class="row">
  <input id="freight" type="number" placeholder="Freight">
  <input id="brokerage" type="number" placeholder="Brokerage">
</div>
</div>

<div class="section">
<select id="country">
<option value="" disabled selected>Country of Origin</option>
<option value="CN">China</option>
<option value="VN">Vietnam</option>
<option value="IN">India</option>
<option value="MX">Mexico</option>
<option value="CA">Canada</option>
</select>
</div>

<div class="section">
<input id="metalPercent" type="number" placeholder="% Metal Content">
<div class="row">
<select id="productType">
<option value="">Type</option>
<option value="raw">Raw</option>
<option value="derivative">Derivative</option>
<option value="industrial">Industrial</option>
</select>

<select id="usMaterial">
<option value="no">Foreign Material</option>
<option value="yes">US Material</option>
</select>
</div>
</div>

<button onclick="runHTS()">Calculate</button>
<div id="output" class="result"></div>

</div>

<!-- PRODUCTS TAB -->
<div id="products" class="tab-content">

<div class="section">
<input id="productSearch" placeholder="Search products" oninput="searchProducts()">
<div id="productResults"></div>
</div>

<div id="productOutput" class="result"></div>

</div>

</div>

<script>

// =========================
// 🔒 CORE ENGINE (DO NOT TOUCH)
// =========================
function tariffEngine(i){

let selected = i.htsData.find(x => x.hts === i.hts);
if(!selected) return { error:"HTS not found" };

let gen = selected.duty * 100;

let s301 = i.country==="CN"
  ? get301Rate(i.hts, i.section301)
  : 0;

let s232 = 0;
let is232 = i.metal > 15;

if(is232){
  if(i.us==="yes") s232=10;
  else if(i.type==="industrial") s232=15;
  else if(i.type==="derivative") s232=25;
  else if(i.type==="raw") s232=50;
}

let s122 = s232>0 ? 0 : 10;

let goods = i.cost * i.units;
let totalRate = gen + s301 + s232 + s122;
let duty = goods * (totalRate/100);

return {
  gen, s301, s232, s122,
  goods,
  duty,
  perUnit: duty/i.units,
  landed: i.cost + (duty/i.units)
};
}
Object.freeze(tariffEngine);

// =========================
// DATA
// =========================
let HTS_DATA=[],SECTION301=[],PRODUCTS=[],selectedHTS=null;

window.onload = async()=>{
let h=await fetch("tariff_database_2026.csv").then(r=>r.text());
let s=await fetch("Listed Commodities.csv").then(r=>r.text());
let p=await fetch("products.csv").then(r=>r.text());

parseHTS(h);
parse301(s);
parseProducts(p);
};

// =========================
// PARSERS
// =========================
function parseCSV(t){
const r=[];let row=[],c='',q=false;
for(let ch of t){
if(ch=='"')q=!q;
else if(ch==','&&!q){row.push(c);c='';}
else if((ch=='\n'||ch=='\r')&&!q){
if(c||row.length){row.push(c);r.push(row);row=[];c='';}}
else c+=ch;}
if(c||row.length){row.push(c);r.push(row);}
return r;
}

function parseHTS(t){
let r=parseCSV(t);
let h=r[0].map(x=>x.toLowerCase());

let hi=h.findIndex(x=>x.includes("hts"));
let di=h.findIndex(x=>x.includes("description"));
let du=h.findIndex(x=>x==="mfn_ad_val_rate");

HTS_DATA=r.slice(1).map(c=>({
hts:(c[hi]||"").replace(/\D/g,'').substring(0,8),
original:c[hi],
desc:c[di],
duty:parseFloat(c[du])||0
}));
}

function parse301(t){
let r=parseCSV(t);
SECTION301=r.slice(1).map(c=>({
hts:(c[0]||"").replace(/\D/g,'').substring(0,8),
rate:parseFloat((c[2]||"0").replace("%",""))||0
}));
}

function parseProducts(t){
let r=parseCSV(t);
let h=r[0].map(x=>x.toLowerCase());

PRODUCTS=r.slice(1).map(c=>({
item:c[h.indexOf("item")],
desc:c[h.indexOf("description")],
cost:parseFloat(c[h.findIndex(x=>x.includes("unit"))])||0,
units:parseFloat((c[h.findIndex(x=>x.includes("annual"))]||"0").replace(/,/g,'')),
country:normalize(c[h.findIndex(x=>x.includes("country"))]),
hts:c[h.findIndex(x=>x.includes("hts"))]
}));
}

function normalize(c){
if(!c) return "";
c=c.toLowerCase();
if(c.includes("china"))return"CN";
return c.toUpperCase();
}

// =========================
// HELPERS
// =========================
function get301Rate(h,list){
for(let i of list){
if(h.startsWith(i.hts.substring(0,6))) return i.rate;
}
return 0;
}

function formatUnits(i){
let v=i.value.replace(/,/g,'').replace(/\D/g,'');
if(v)i.value=parseInt(v).toLocaleString();
}

// =========================
// UI
// =========================
function switchTab(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add("active");
document.getElementById(id).classList.add("active");
}

// =========================
// HTS FLOW
// =========================
function searchHTS(){
let q=document.getElementById("search").value.toLowerCase();
let m=HTS_DATA.filter(x=>
x.hts.startsWith(q.replace(/\D/g,''))||
(x.desc||"").toLowerCase().includes(q)
).slice(0,10);

let d=document.getElementById("results");d.innerHTML="";
m.forEach(i=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=`${i.original}<br><small>${i.desc}</small>`;
el.onclick=()=>{selectedHTS=i;d.innerHTML=`Selected: ${i.original}`};
d.appendChild(el);
});
}

function runHTS(){

let r=tariffEngine({
cost:+cost.value||0,
units:parseFloat(units.value.replace(/,/g,''))||1,
country:country.value,
hts:selectedHTS.hts,
metal:+metalPercent.value||0,
type:productType.value,
us:usMaterial.value,
htsData:HTS_DATA,
section301:SECTION301
});

render(r,"output");
}

// =========================
// PRODUCT FLOW
// =========================
function searchProducts(){
let q=productSearch.value.toLowerCase();
let m=PRODUCTS.filter(p=>
(p.item||"").toLowerCase().includes(q)||
(p.desc||"").toLowerCase().includes(q)
).slice(0,10);

let d=document.getElementById("productResults");d.innerHTML="";
m.forEach(p=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=`${p.item}<br><small>${p.desc}</small>`;
el.onclick=()=>selectProduct(p);
d.appendChild(el);
});
}

function selectProduct(p){

let norm=p.hts.replace(/\D/g,'').substring(0,8);

let r=tariffEngine({
cost:p.cost,
units:p.units,
country:p.country,
hts:norm,
metal:0,
type:"",
us:"no",
htsData:HTS_DATA,
section301:SECTION301
});

render(r,"productOutput");
}

// =========================
// RENDER
// =========================
function render(r,id){

let html=`
<div class="big">$${r.landed.toFixed(2)}</div>
<div>Per Unit Landed Cost</div>

<hr>

Goods Value: $${r.goods.toLocaleString()}<br>
Total Duty Impact: $${r.duty.toLocaleString()}

<hr>

General (${r.gen.toFixed(1)}%): $${((r.goods*(r.gen/100))/r.goods*r.goods/r.goods).toFixed(3)}<br>
Section 301 (${r.s301}%): $${((r.goods*(r.s301/100))/r.goods*r.goods/r.goods).toFixed(2)}<br>
${r.s232>0 ? `Section 232 (${r.s232}%): $${((r.goods*(r.s232/100))/r.goods*r.goods/r.goods).toFixed(2)}` : `Section 232: Not subject`}<br>
Section 122 (${r.s122}%): $${((r.goods*(r.s122/100))/r.goods*r.goods/r.goods).toFixed(2)}<br>

<hr>

Total Duty per Unit: $${r.perUnit.toFixed(2)}
`;

document.getElementById(id).innerHTML=html;
}

</script>

</body>
</html>
