<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTS Tariff Engine</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0d1117;color:#e6edf3;margin:0;}
header {background:#161b22;padding:18px;font-size:22px;text-align:center;border-bottom:1px solid #30363d;}
.container {max-width:520px;margin:auto;padding:12px;}
.section {background:#161b22;border-radius:14px;padding:14px;margin-top:14px;}
h3 {font-size:14px;color:#8b949e;}
.helper {font-size:11px;color:#8b949e;margin-bottom:2px;}

input, select {
  width:100%;padding:11px;margin:6px 0;border-radius:10px;
  border:1px solid #30363d;background:#0d1117;color:white;
  font-size:16px;box-sizing:border-box;
}

.row {display:flex;gap:10px;}
.row > div {flex:1;}

button {
  padding:14px;border-radius:12px;border:none;
  background:#2ea043;color:white;font-size:16px;
  width:100%;margin-top:12px;
}

.result {margin-top:16px;background:#161b22;border-radius:14px;padding:15px;}
.big {font-size:26px;font-weight:bold;color:#3fb950;}
.item {padding:10px;border-bottom:1px solid #30363d;cursor:pointer;}
.item:hover {background:#21262d;}
</style>
</head>

<body>

<header>HTS Tariff Engine</header>

<div class="container">

<div class="section">
<h3>HTS Lookup</h3>
<input id="search" placeholder="Enter HTS or description">
<button onclick="searchHTS()">Search</button>
<div id="results"></div>
</div>

<div class="section">
<h3>Cost Inputs</h3>

<div class="row">
  <div>
    <div class="helper">Unit Cost</div>
    <input id="cost" type="number">
  </div>

  <div>
    <div class="helper">Units</div>
    <input id="units" type="text" oninput="formatUnits(this)">
  </div>
</div>

<div class="row">
  <div>
    <div class="helper">Freight</div>
    <input id="freight" type="number">
  </div>

  <div>
    <div class="helper">Brokerage</div>
    <input id="brokerage" type="number">
  </div>
</div>

<input id="other" type="number" placeholder="Other Costs">

</div>

<div class="section">
<h3>Origin</h3>
<select id="country">
<option value="" disabled selected>Select Country *</option>
<option value="CN">China</option>
<option value="VN">Vietnam</option>
<option value="IN">India</option>
<option value="MX">Mexico</option>
<option value="CA">Canada</option>
</select>
</div>

<div class="section">
<h3>Section 232</h3>
<input id="metalPercent" type="number" placeholder="% Metal Content">

<div class="row">
  <select id="productType">
    <option value="">Type</option>
    <option value="raw">Raw</option>
    <option value="derivative">Derivative</option>
    <option value="industrial">Industrial</option>
  </select>

  <select id="usMaterial">
    <option value="no">Foreign</option>
    <option value="yes">US Material</option>
  </select>
</div>
</div>

<div class="section">
<h3>Section 122</h3>
<div class="helper">10% global tariff unless Section 232 applies</div>
</div>

<button onclick="calculate()">Calculate</button>

<div id="output" class="result"></div>

</div>

<script>

let HTS_DATA=[],SECTION301_LIST=[],selectedHTS=null;

function formatUnits(input){
  let val = input.value.replace(/,/g,'').replace(/\D/g,'');
  if(val){ input.value = parseInt(val).toLocaleString(); }
}

async function loadData(){
  let h=await fetch("tariff_database_2026.csv").then(r=>r.text());
  let s=await fetch("Listed Commodities.csv").then(r=>r.text());
  parseHTS(h);
  parse301(s);
}

window.onload = loadData;

function parseCSV(t){
const r=[];let row=[],c='',q=false;
for(let ch of t){
if(ch=='"')q=!q;
else if(ch==','&&!q){row.push(c);c='';}
else if((ch=='\n'||ch=='\r')&&!q){
if(c||row.length){row.push(c);r.push(row);row=[];c='';}}
else c+=ch;}
if(c||row.length){row.push(c);r.push(row);}
return r;
}

// ✅ FIXED: correct column mapping
function parseHTS(t){
  let r=parseCSV(t);
  let headers=r[0].map(x=>x.toLowerCase().trim());

  let hi=headers.findIndex(x=>x.includes("hts"));
  let di=headers.findIndex(x=>x.includes("description"));

  // 🔥 exact match to your file
  let du=headers.findIndex(x=>x==="mfn_ad_val_rate");

  HTS_DATA=r.slice(1).map(c=>({
    hts:(c[hi]||"").replace(/\D/g,'').substring(0,8),
    originalHTS:c[hi],
    description:c[di],
    duty:parseFloat(c[du]) || 0
  }));
}

function parse301(t){
  let r=parseCSV(t);
  SECTION301_LIST=r.slice(1).map(c=>({
    hts:(c[0]||"").replace(/\D/g,'').substring(0,8),
    rate:parseFloat((c[2]||"0").replace("%",""))||0
  }));
}

function get301Rate(h){
  for(let i of SECTION301_LIST){
    if(h.startsWith(i.hts.substring(0,6))) return i.rate;
  }
  return 0;
}

function searchHTS(){
  let q=document.getElementById("search").value.toLowerCase();

  let results=HTS_DATA.filter(i =>
    i.hts.startsWith(q.replace(/\D/g,'')) ||
    (i.description||"").toLowerCase().includes(q)
  ).slice(0,10);

  let div=document.getElementById("results");
  div.innerHTML="";

  results.forEach(i=>{
    let el=document.createElement("div");
    el.className="item";
    el.innerHTML=`<strong>${i.originalHTS}</strong><br><small>${i.description}</small>`;
    el.onclick=()=>{
      selectedHTS=i;
      div.innerHTML=`Selected: ${i.originalHTS}`;
    };
    div.appendChild(el);
  });
}

function calculate(){

if(!selectedHTS) return alert("Select HTS");

let costVal=+document.getElementById("cost").value||0;
let unitsVal=parseFloat(document.getElementById("units").value.replace(/,/g,''))||1;
let ctry=document.getElementById("country").value;

let metal=+document.getElementById("metalPercent").value||0;
let ptype=document.getElementById("productType").value;
let us=document.getElementById("usMaterial").value;

// ✅ convert to %
let gen=selectedHTS.duty * 100;

let s301=ctry==="CN"?get301Rate(selectedHTS.hts):0;

// 232 logic
let s232=0;
let is232Applicable = metal > 0 || ptype || us==="yes";

if(is232Applicable){
  if(metal<=15)s232=0;
  else if(us==="yes")s232=10;
  else if(ptype==="industrial")s232=15;
  else if(ptype==="derivative")s232=25;
  else if(ptype==="raw")s232=50;
}

let s122=s232>0?0:10;

let goods=costVal*unitsVal;
let totalRate=gen+s301+s232+s122;
let duty=goods*(totalRate/100);

// precision fix
let dGenUnit=(goods*(gen/100))/unitsVal;

let section232Text = is232Applicable
  ? `Section 232 (${s232}%): $${((goods*(s232/100))/unitsVal).toFixed(2)}`
  : `Section 232: Not subject`;

document.getElementById("output").innerHTML=`
<div class="big">$${(costVal + duty/unitsVal).toFixed(2)}</div>
<div>Per Unit Landed Cost</div>

<hr>

<strong>Goods Value:</strong> $${goods.toLocaleString()}<br>
<strong>Total Duty Impact:</strong> $${duty.toLocaleString()}

<hr>

<strong>Duty per Unit</strong><br>
General Rate of Duty (${gen.toFixed(1)}%): $${dGenUnit.toFixed(3)}<br>
Section 301 (${s301}%): $${((goods*(s301/100))/unitsVal).toFixed(2)}<br>
${section232Text}<br>
Section 122 (${s122}%): $${((goods*(s122/100))/unitsVal).toFixed(2)}<br>

<hr>

<strong>Total Duty per Unit:</strong> $${(duty/unitsVal).toFixed(2)}
`;
}

</script>

</body>
</html>
