<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTS Tariff Engine</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0d1117;color:#e6edf3;margin:0;}
header {background:#161b22;padding:18px;font-size:22px;text-align:center;border-bottom:1px solid #30363d;}

.tabs {display:flex;background:#161b22;border-bottom:1px solid #30363d;}
.tab {flex:1;padding:14px;text-align:center;cursor:pointer;color:#8b949e;}
.tab.active {color:white;border-bottom:2px solid #2ea043;}

.container {max-width:520px;margin:auto;padding:12px;}
.tab-content {display:none;}
.tab-content.active {display:block;}

.section {background:#161b22;border-radius:14px;padding:14px;margin-top:14px;}

input, select {
  width:100%;padding:11px;margin:6px 0;border-radius:10px;
  border:1px solid #30363d;background:#0d1117;color:white;
  font-size:16px;box-sizing:border-box;
}

.row {display:flex;gap:10px;}
.row > div {flex:1;}

button {
  padding:14px;border-radius:12px;border:none;
  background:#2ea043;color:white;font-size:16px;
  width:100%;margin-top:12px;
}

.result {margin-top:16px;background:#161b22;border-radius:14px;padding:15px;}
.big {font-size:26px;font-weight:bold;color:#3fb950;}

.item {padding:10px;border-bottom:1px solid #30363d;cursor:pointer;}
.item:hover {background:#21262d;}
</style>
</head>

<body>

<header>HTS Tariff Engine</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('hts')">HTS Lookup</div>
  <div class="tab" onclick="switchTab('products')">Current Products</div>
</div>

<div class="container">

<!-- HTS TAB -->
<div id="hts" class="tab-content active">

<div class="section">
<input id="search" placeholder="Enter HTS or description">
<button onclick="searchHTS()">Search</button>
<div id="results"></div>
</div>

<div class="section">
<div class="row">
  <input id="cost" type="number" placeholder="Unit Cost">
  <input id="units" type="text" placeholder="Units" oninput="formatUnits(this)">
</div>
</div>

<div class="section">
<select id="country">
<option value="" disabled selected>Country</option>
<option value="CN">China</option>
<option value="VN">Vietnam</option>
<option value="IN">India</option>
<option value="MX">Mexico</option>
<option value="CA">Canada</option>
</select>
</div>

<div class="section">
<input id="metalPercent" type="number" placeholder="% Metal Content">

<div class="row">
<select id="productType">
<option value="">Type</option>
<option value="raw">Raw</option>
<option value="derivative">Derivative</option>
<option value="industrial">Industrial</option>
</select>

<select id="usMaterial">
<option value="no">Foreign</option>
<option value="yes">US Material</option>
</select>
</div>
</div>

<button onclick="calculate()">Calculate</button>
<div id="output" class="result"></div>

</div>

<!-- PRODUCTS TAB -->
<div id="products" class="tab-content">

<div class="section">
<input id="productSearch" placeholder="Search products" oninput="searchProducts()">
<div id="productResults"></div>
</div>

<div id="productOutput" class="result"></div>

</div>

</div>

<script>

let HTS_DATA=[],SECTION301_LIST=[],PRODUCT_DATA=[],selectedHTS=null;

// LOAD DATA
window.onload = async()=>{
  let h=await fetch("tariff_database_2026.csv").then(r=>r.text());
  let s=await fetch("Listed Commodities.csv").then(r=>r.text());
  let p=await fetch("products.csv").then(r=>r.text());

  parseHTS(h);
  parse301(s);
  parseProducts(p);
};

// CSV PARSER
function parseCSV(t){
const r=[];let row=[],c='',q=false;
for(let ch of t){
if(ch=='"')q=!q;
else if(ch==','&&!q){row.push(c);c='';}
else if((ch=='\n'||ch=='\r')&&!q){
if(c||row.length){row.push(c);r.push(row);row=[];c='';}}
else c+=ch;}
if(c||row.length){row.push(c);r.push(row);}
return r;
}

// HTS
function parseHTS(t){
let r=parseCSV(t);
let h=r[0].map(x=>x.toLowerCase());

let hi=h.findIndex(x=>x.includes("hts"));
let di=h.findIndex(x=>x.includes("description"));
let du=h.findIndex(x=>x==="mfn_ad_val_rate");

HTS_DATA=r.slice(1).map(c=>({
hts:(c[hi]||"").replace(/\D/g,'').substring(0,8),
originalHTS:c[hi],
description:c[di],
duty:parseFloat(c[du])||0
}));
}

// 301
function parse301(t){
let r=parseCSV(t);
SECTION301_LIST=r.slice(1).map(c=>({
hts:(c[0]||"").replace(/\D/g,'').substring(0,8),
rate:parseFloat((c[2]||"0").replace("%",""))||0
}));
}

function get301Rate(h){
for(let i of SECTION301_LIST){
if(h.startsWith(i.hts.substring(0,6))) return i.rate;}
return 0;
}

// PRODUCTS
function parseProducts(t){
let r=parseCSV(t);
let h=r[0].map(x=>x.toLowerCase());

function idx(name){
let i=h.findIndex(x=>x.includes(name));
return i===-1?null:i;
}

let m={
item:idx("item"),
desc:idx("description"),
cost:idx("unit"),
units:idx("annual"),
metal:idx("metal"),
type:idx("type"),
us:idx("foreign"),
country:idx("country"),
hts:idx("hts")
};

PRODUCT_DATA=r.slice(1).map(c=>({
item:c[m.item],
description:c[m.desc],
cost:parseFloat((c[m.cost]||"0").replace("$",""))||0,
units:parseFloat((c[m.units]||"0").replace(/,/g,''))||0,
metal:parseFloat(c[m.metal])||0,
type:(c[m.type]||"").toLowerCase(),
us:(c[m.us]||"").toLowerCase().includes("us")?"yes":"no",
country:(c[m.country]||"").toLowerCase().includes("china")?"CN":(c[m.country]||"").toUpperCase(),
hts:c[m.hts]
}));
}

// SEARCH HTS (FIXED)
function searchHTS(){
let q=search.value.toLowerCase();

let res=HTS_DATA.filter(i=>
i.hts.startsWith(q.replace(/\D/g,''))||
(i.description||"").toLowerCase().includes(q)
).slice(0,10);

results.innerHTML="";
res.forEach(i=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=`${i.originalHTS}<br><small>${i.description}</small>`;
el.onclick=()=>{selectedHTS=i;results.innerHTML=`Selected: ${i.originalHTS}`};
results.appendChild(el);
});
}

// CALCULATE HTS
function calculate(){
if(!selectedHTS)return alert("Select HTS");

let cost=+cost.value||0;
let units=parseFloat(units.value.replace(/,/g,''))||1;
let country=country.value;

let gen=selectedHTS.duty*100;
let s301=country==="CN"?get301Rate(selectedHTS.hts):0;

let metal=+metalPercent.value||0;
let type=productType.value;
let us=usMaterial.value;

let s232=0;
if(metal>15){
if(us==="yes")s232=10;
else if(type==="industrial")s232=15;
else if(type==="derivative")s232=25;
else if(type==="raw")s232=50;
}

let s122=s232>0?0:10;

let goods=cost*units;
let duty=goods*((gen+s301+s232+s122)/100);

output.innerHTML=`
<div class="big">$${(cost + duty/units).toFixed(2)}</div>
Per Unit Landed Cost
<hr>
Goods Value: $${goods.toLocaleString()}<br>
Total Duty Impact: $${duty.toLocaleString()}
<hr>
General (${gen.toFixed(1)}%)<br>
Section 301 (${s301}%)<br>
${s232>0?`Section 232 (${s232}%)`:`Section 232: Not subject`}<br>
Section 122 (${s122}%)
`;
}

// PRODUCT SEARCH
function searchProducts(){
let q=productSearch.value.toLowerCase();

let m=PRODUCT_DATA.filter(p=>
(p.item||"").toLowerCase().includes(q)||
(p.description||"").toLowerCase().includes(q)
).slice(0,10);

productResults.innerHTML="";
m.forEach(p=>{
let el=document.createElement("div");
el.className="item";
el.innerHTML=`${p.item}<br><small>${p.description}</small>`;
el.onclick=()=>selectProduct(p);
productResults.appendChild(el);
});
}

// PRODUCT SELECT
function selectProduct(p){

let match=HTS_DATA.find(x=>x.hts===p.hts.replace(/\D/g,'').substring(0,8));
if(!match)return alert("HTS not found");

let gen=match.duty*100;
let s301=p.country==="CN"?get301Rate(match.hts):0;

let s232=0;
if(p.metal>15){
if(p.us==="yes")s232=10;
else if(p.type.includes("industrial"))s232=15;
else if(p.type.includes("derivative"))s232=25;
else if(p.type.includes("raw"))s232=50;
}

let s122=s232>0?0:10;

let goods=p.cost*p.units;
let duty=goods*((gen+s301+s232+s122)/100);

productOutput.innerHTML=`
<div class="big">$${(p.cost + duty/p.units).toFixed(2)}</div>
Per Unit Landed Cost
<hr>
Goods Value: $${goods.toLocaleString()}<br>
Total Duty Impact: $${duty.toLocaleString()}
<hr>
General (${gen.toFixed(1)}%)<br>
Section 301 (${s301}%)<br>
${s232>0?`Section 232 (${s232}%)`:`Section 232: Not subject`}<br>
Section 122 (${s122}%)
`;
}

function switchTab(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add("active");
document.getElementById(id).classList.add("active");
}

function formatUnits(i){
let v=i.value.replace(/,/g,'').replace(/\D/g,'');
if(v)i.value=parseInt(v).toLocaleString();
}

</script>

</body>
</html>
