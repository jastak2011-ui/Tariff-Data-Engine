<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTS Tariff Engine</title>

<style>
body {font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0d1117;color:#e6edf3;margin:0;}
header {background:#161b22;padding:18px;font-size:22px;text-align:center;border-bottom:1px solid #30363d;}

.tabs {display:flex;background:#161b22;border-bottom:1px solid #30363d;}
.tab {flex:1;padding:14px;text-align:center;cursor:pointer;color:#8b949e;}
.tab.active {color:white;border-bottom:2px solid #2ea043;}

.container {max-width:520px;margin:auto;padding:12px;}
.tab-content {display:none;}
.tab-content.active {display:block;}

.section {background:#161b22;border-radius:14px;padding:14px;margin-top:14px;}

h3 {font-size:14px;color:#8b949e;}
.helper {font-size:11px;color:#8b949e;margin-bottom:2px;}

input, select {
  width:100%;padding:11px;margin:6px 0;border-radius:10px;
  border:1px solid #30363d;background:#0d1117;color:white;
  font-size:16px;box-sizing:border-box;
}

.row {display:flex;gap:10px;}
.row > div {flex:1;}

button {
  padding:14px;border-radius:12px;border:none;
  background:#2ea043;color:white;font-size:16px;
  width:100%;margin-top:12px;
}

.result {margin-top:16px;background:#161b22;border-radius:14px;padding:15px;}
.big {font-size:26px;font-weight:bold;color:#3fb950;}

.item {padding:10px;border-bottom:1px solid #30363d;cursor:pointer;}
.item:hover {background:#21262d;}
</style>
</head>

<body>

<header>HTS Tariff Engine</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('hts')">HTS Lookup</div>
  <div class="tab" onclick="switchTab('products')">Current Products</div>
</div>

<div class="container">

<!-- HTS TAB (UNCHANGED) -->
<div id="hts" class="tab-content active">

<div class="section">
<h3>HTS Lookup</h3>
<input id="search" placeholder="Enter HTS or description">
<button onclick="searchHTS()">Search</button>
<div id="results"></div>
</div>

<div class="section">
<h3>Cost Inputs</h3>

<div class="row">
  <div>
    <div class="helper">Unit Cost</div>
    <input id="cost" type="number">
  </div>

  <div>
    <div class="helper">Units</div>
    <input id="units" type="text" oninput="formatUnits(this)">
  </div>
</div>

<div class="row">
  <div>
    <div class="helper">Freight</div>
    <input id="freight" type="number">
  </div>

  <div>
    <div class="helper">Brokerage</div>
    <input id="brokerage" type="number">
  </div>
</div>

<input id="other" type="number" placeholder="Other Costs">

</div>

<div class="section">
<h3>Origin</h3>
<select id="country">
<option value="" disabled selected>Select Country *</option>
<option value="CN">China</option>
<option value="VN">Vietnam</option>
<option value="IN">India</option>
<option value="MX">Mexico</option>
<option value="CA">Canada</option>
</select>
</div>

<div class="section">
<h3>Section 232</h3>
<input id="metalPercent" type="number" placeholder="% Metal Content">

<div class="row">
  <select id="productType">
    <option value="">Type</option>
    <option value="raw">Raw</option>
    <option value="derivative">Derivative</option>
    <option value="industrial">Industrial</option>
  </select>

  <select id="usMaterial">
    <option value="no">Foreign</option>
    <option value="yes">US Material</option>
  </select>
</div>
</div>

<div class="section">
<h3>Section 122</h3>
<div class="helper">10% global tariff unless Section 232 applies</div>
</div>

<button onclick="calculate()">Calculate</button>
<div id="output" class="result"></div>

</div>

<!-- CURRENT PRODUCTS TAB (FIXED) -->
<div id="products" class="tab-content">

<div class="section">
<h3>Search Current Products</h3>
<input id="productSearch" placeholder="Search Item or Description" oninput="searchProducts()">
<div id="productResults"></div>
</div>

<div id="productOutput" class="result"></div>

</div>

</div>

<script>

let HTS_DATA=[],SECTION301_LIST=[],PRODUCT_DATA=[],selectedHTS=null;

window.onload = async function(){
  await loadData();
  await loadProducts();
};

function switchTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add("active");
  document.getElementById(id).classList.add("active");
}

function formatUnits(input){
  let val = input.value.replace(/,/g,'').replace(/\D/g,'');
  if(val){ input.value = parseInt(val).toLocaleString(); }
}

async function loadData(){
  let h=await fetch("tariff_database_2026.csv").then(r=>r.text());
  let s=await fetch("Listed Commodities.csv").then(r=>r.text());
  parseHTS(h);
  parse301(s);
}

async function loadProducts(){
  let res=await fetch("products.csv");
  let text=await res.text();

  let rows=parseCSV(text);
  let headers=rows[0].map(h=>h.toLowerCase());

  let itemIndex=headers.indexOf("item");
  let descIndex=headers.indexOf("description");
  let costIndex=headers.findIndex(h=>h.includes("unit"));
  let unitsIndex=headers.findIndex(h=>h.includes("annual"));
  let cooIndex=headers.findIndex(h=>h.includes("country"));
  let htsIndex=headers.findIndex(h=>h.includes("hts"));

  PRODUCT_DATA=rows.slice(1).map(r=>({
    item:r[itemIndex],
    description:r[descIndex],
    cost:parseFloat((r[costIndex]||"0").replace("$",""))||0,
    units:parseFloat((r[unitsIndex]||"0").replace(/,/g,'')),
    country:(r[cooIndex]||"").toUpperCase(),
    hts:r[htsIndex]
  }));
}

function parseCSV(t){
const r=[];let row=[],c='',q=false;
for(let ch of t){
if(ch=='"')q=!q;
else if(ch==','&&!q){row.push(c);c='';}
else if((ch=='\n'||ch=='\r')&&!q){
if(c||row.length){row.push(c);r.push(row);row=[];c='';}}
else c+=ch;}
if(c||row.length){row.push(c);r.push(row);}
return r;
}

function parseHTS(t){
  let r=parseCSV(t);
  let headers=r[0].map(x=>x.toLowerCase().trim());

  let hi=headers.findIndex(x=>x.includes("hts"));
  let di=headers.findIndex(x=>x.includes("description"));
  let du=headers.findIndex(x=>x==="mfn_ad_val_rate");

  HTS_DATA=r.slice(1).map(c=>({
    hts:(c[hi]||"").replace(/\D/g,'').substring(0,8),
    originalHTS:c[hi],
    description:c[di],
    duty:parseFloat(c[du]) || 0
  }));
}

function parse301(t){
  let r=parseCSV(t);
  SECTION301_LIST=r.slice(1).map(c=>({
    hts:(c[0]||"").replace(/\D/g,'').substring(0,8),
    rate:parseFloat((c[2]||"0").replace("%",""))||0
  }));
}

function get301Rate(h){
  for(let i of SECTION301_LIST){
    if(h.startsWith(i.hts.substring(0,6))) return i.rate;
  }
  return 0;
}

function searchProducts(){
  let q=document.getElementById("productSearch").value.toLowerCase();

  let matches=PRODUCT_DATA.filter(p =>
    (p.item && p.item.toLowerCase().includes(q)) ||
    (p.description && p.description.toLowerCase().includes(q))
  ).slice(0,10);

  let div=document.getElementById("productResults");
  div.innerHTML="";

  matches.forEach(p=>{
    let el=document.createElement("div");
    el.className="item";
    el.innerHTML=`<strong>${p.item}</strong><br><small>${p.description}</small>`;
    el.onclick=()=>selectProduct(p);
    div.appendChild(el);
  });
}

function selectProduct(p){

  let norm=(p.hts||"").replace(/\D/g,'').substring(0,8);
  let match=HTS_DATA.find(x=>x.hts===norm);

  if(!match){
    alert("HTS not found for this product");
    return;
  }

  let gen = match.duty * 100;
  let s301 = p.country==="CN" ? get301Rate(match.hts) : 0;

  let goods = p.cost * p.units;
  let totalRate = gen + s301 + 10;
  let duty = goods * (totalRate/100);

  document.getElementById("productOutput").innerHTML=`
  <div class="big">$${(p.cost + duty/p.units).toFixed(2)}</div>
  <div>Per Unit Landed Cost</div>

  <hr>

  <strong>Goods Value:</strong> $${goods.toLocaleString()}<br>
  <strong>Total Duty Impact:</strong> $${duty.toLocaleString()}

  <hr>

  <strong>Duty per Unit</strong><br>
  General Rate of Duty (${gen.toFixed(1)}%): $${((goods*(gen/100))/p.units).toFixed(3)}<br>
  ${p.country==="CN" ? `Section 301 (${s301}%): $${((goods*(s301/100))/p.units).toFixed(2)}<br>` : ""}
  Section 232: Not subject<br>
  Section 122 (10%): $${((goods*(10/100))/p.units).toFixed(2)}<br>

  <hr>

  <strong>Total Duty per Unit:</strong> $${(duty/p.units).toFixed(2)}
  `;
}

</script>

</body>
</html>
