<script>

let HTS_DATA=[],SECTION301_LIST=[],PRODUCT_DATA=[],selectedHTS=null;

window.onload = async function(){
  await loadData();
  await loadProducts();
};

// =======================
// LOAD PRODUCTS (UPDATED)
// =======================
async function loadProducts(){
  let res=await fetch("products.csv");
  let text=await res.text();

  let rows=parseCSV(text);
  let headers=rows[0].map(h=>h.toLowerCase());

  let itemIndex=headers.indexOf("item");
  let descIndex=headers.indexOf("description");
  let costIndex=headers.findIndex(h=>h.includes("unit"));
  let unitsIndex=headers.findIndex(h=>h.includes("annual"));
  let metalIndex=headers.findIndex(h=>h.includes("metal"));
  let typeIndex=headers.findIndex(h=>h.includes("type"));
  let usIndex=headers.findIndex(h=>h.includes("foreign"));
  let cooIndex=headers.findIndex(h=>h.includes("country"));
  let htsIndex=headers.findIndex(h=>h.includes("hts"));

  PRODUCT_DATA=rows.slice(1).map(r=>({
    item:r[itemIndex],
    description:r[descIndex],
    cost:parseFloat((r[costIndex]||"0").replace("$",""))||0,
    units:parseFloat((r[unitsIndex]||"0").replace(/,/g,'')),
    metal:parseFloat(r[metalIndex])||0,
    type:(r[typeIndex]||"").toLowerCase(),
    us:(r[usIndex]||"").toLowerCase().includes("us") ? "yes" : "no",
    country:normalizeCountry(r[cooIndex]),
    hts:r[htsIndex]
  }));
}

function normalizeCountry(c){
  if(!c) return "";
  c=c.toLowerCase();
  if(c.includes("china"))return"CN";
  return c.toUpperCase();
}

// =======================
// PRODUCT SELECTION (UPDATED)
// =======================
function selectProduct(p){

  let norm=(p.hts||"").replace(/\D/g,'').substring(0,8);
  let match=HTS_DATA.find(x=>x.hts===norm);

  if(!match){
    alert("HTS not found for this product");
    return;
  }

  let gen = match.duty * 100;
  let s301 = p.country==="CN" ? get301Rate(match.hts) : 0;

  // 🔥 SECTION 232 (NOW USING YOUR DATA)
  let s232 = 0;
  let is232Applicable = p.metal > 15;

  if(is232Applicable){
    if(p.us==="yes") s232=10;
    else if(p.type.includes("industrial")) s232=15;
    else if(p.type.includes("derivative")) s232=25;
    else if(p.type.includes("raw")) s232=50;
  }

  // 🔥 SECTION 122 EXCLUSION
  let s122 = s232 > 0 ? 0 : 10;

  let goods = p.cost * p.units;
  let totalRate = gen + s301 + s232 + s122;
  let duty = goods * (totalRate/100);

  document.getElementById("productOutput").innerHTML=`
  <div class="big">$${(p.cost + duty/p.units).toFixed(2)}</div>
  <div>Per Unit Landed Cost</div>

  <hr>

  <strong>Goods Value:</strong> $${goods.toLocaleString()}<br>
  <strong>Total Duty Impact:</strong> $${duty.toLocaleString()}

  <hr>

  <strong>Duty per Unit</strong><br>
  General Rate of Duty (${gen.toFixed(1)}%): $${((goods*(gen/100))/p.units).toFixed(3)}<br>
  ${p.country==="CN" ? `Section 301 (${s301}%): $${((goods*(s301/100))/p.units).toFixed(2)}<br>` : ""}
  ${is232Applicable
    ? `Section 232 (${s232}%): $${((goods*(s232/100))/p.units).toFixed(2)}<br>`
    : `Section 232: Not subject<br>`}
  Section 122 (${s122}%): $${((goods*(s122/100))/p.units).toFixed(2)}<br>

  <hr>

  <strong>Total Duty per Unit:</strong> $${(duty/p.units).toFixed(2)}
  `;
}

</script>
