<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTS Tariff Engine</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  background: #0d1117;
  color: #e6edf3;
  margin: 0;
}

header {
  background: #161b22;
  padding: 18px;
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  border-bottom: 1px solid #30363d;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 12px;
}

.section {
  background: #161b22;
  border-radius: 14px;
  padding: 14px;
  margin-top: 14px;
}

h3 {
  margin: 0 0 10px 0;
  font-size: 14px;
  color: #8b949e;
}

input, select {
  width: 100%;
  padding: 11px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #30363d;
  background: #0d1117;
  color: white;
  font-size: 16px;
  box-sizing: border-box;
}

.row {
  display: flex;
  gap: 10px;
}

.row input, .row select {
  flex: 1;
}

button {
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #2ea043;
  color: white;
  font-size: 16px;
  width: 100%;
  margin-top: 12px;
}

.result {
  margin-top: 16px;
  background: #161b22;
  border-radius: 14px;
  padding: 15px;
}

.big {
  font-size: 26px;
  font-weight: bold;
  color: #3fb950;
}

.sub {
  color: #8b949e;
  font-size: 13px;
}

.item {
  padding: 10px;
  border-bottom: 1px solid #30363d;
  cursor: pointer;
}

.item:hover {
  background: #21262d;
}

.helper {
  font-size: 12px;
  color: #8b949e;
}

ul li {
  margin-bottom: 8px;
}

hr {
  border: none;
  border-top: 1px solid #30363d;
  margin: 12px 0;
}
</style>
</head>

<body>

<header>HTS Tariff Engine</header>

<div class="container">

<div class="section">
  <h3>HTS Lookup</h3>
  <input id="search" placeholder="Enter HTS (6–8 digits) or description" oninput="cleanInput()">
  <button onclick="searchHTS()">Search</button>
  <div id="results"></div>
</div>

<div class="section">
  <h3>Cost Inputs</h3>
  <div class="row">
    <input id="cost" type="number" placeholder="Unit Cost">
    <input id="units" type="number" placeholder="Units">
  </div>
  <div class="row">
    <input id="freight" type="number" placeholder="Freight">
    <input id="brokerage" type="number" placeholder="Brokerage">
  </div>
  <input id="other" type="number" placeholder="Other Costs">
</div>

<div class="section">
  <h3>Origin</h3>
  <select id="country">
    <option value="" disabled selected>Select Country *</option>
    <option value="CN">China</option>
    <option value="VN">Vietnam</option>
    <option value="IN">India</option>
    <option value="MX">Mexico</option>
  </select>
</div>

<div class="section">
  <h3 onclick="open232()" style="cursor:pointer;">Section 232 ⓘ</h3>
  <input id="metalPercent" type="number" placeholder="% Metal Content">
  <div class="row">
    <select id="productType">
      <option value="">Type</option>
      <option value="raw">Raw</option>
      <option value="derivative">Derivative</option>
      <option value="industrial">Industrial</option>
    </select>
    <select id="usMaterial">
      <option value="no">Foreign</option>
      <option value="yes">US Material</option>
    </select>
  </div>
</div>

<div class="section">
  <h3>Section 122</h3>
  <div class="helper">Global 10% tariff unless Section 232 applies</div>
</div>

<button onclick="calculate()">Calculate</button>

<div id="output" class="result"></div>

</div>

<!-- MODAL -->
<div id="modal232" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
  <div style="background:#161b22; margin:15% auto; padding:20px; width:90%; max-width:420px; border-radius:12px;">
    <h3>Section 232 Explained</h3>
    <ul>
      <li>50% – Raw metals</li>
      <li>25% – Derivative products</li>
      <li>15% – Industrial equipment</li>
      <li>10% – US metal</li>
      <li>0% – ≤15% metal</li>
    </ul>
    <button onclick="close232()">Close</button>
  </div>
</div>

<script>

let HTS_DATA = [];
let SECTION301_LIST = [];
let selectedHTS = null;

function cleanInput() {
  let input = document.getElementById("search");
  input.value = input.value.replace(/[^a-zA-Z0-9]/g, '');
}

function normalizeHTS(hts) {
  return (hts || "").replace(/[^0-9]/g, '').substring(0,8);
}

function parseCSV(text) {
  const rows = [];
  let row = [], current = '', inQuotes = false;
  for (let char of text) {
    if (char === '"') inQuotes = !inQuotes;
    else if (char === ',' && !inQuotes) { row.push(current); current = ''; }
    else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (current || row.length) { row.push(current); rows.push(row); row = []; current = ''; }
    } else current += char;
  }
  if (current || row.length) { row.push(current); rows.push(row); }
  return rows;
}

async function loadData() {
  let hts = await fetch("tariff_database_2026.csv").then(r => r.text());
  let s301 = await fetch("Listed Commodities.csv").then(r => r.text());
  parseHTS(hts);
  parse301(s301);
}
window.onload = loadData;

function parseHTS(text) {
  let rows = parseCSV(text);
  let headers = rows[0].map(h => h.toLowerCase());
  let htsIndex = headers.findIndex(h => h.includes("hts"));
  let descIndex = headers.findIndex(h => h.includes("description"));
  let dutyIndex = headers.findIndex(h => h.includes("mfn") || h.includes("general"));

  HTS_DATA = rows.slice(1).map(cols => ({
    hts: normalizeHTS(cols[htsIndex]),
    originalHTS: cols[htsIndex],
    description: cols[descIndex],
    duty: parseFloat((cols[dutyIndex] || "0").replace("%","")) || 0
  }));
}

function parse301(text) {
  let rows = parseCSV(text);
  SECTION301_LIST = rows.slice(1).map(cols => ({
    hts: normalizeHTS(cols[0]),
    rate: parseFloat((cols[2] || "0").replace("%","")) || 0
  }));
}

function get301Rate(hts) {
  let clean = normalizeHTS(hts);
  for (let item of SECTION301_LIST) {
    if (clean.substring(0,6) === item.hts.substring(0,6)) return item.rate;
  }
  return 0;
}

function searchHTS() {
  let raw = document.getElementById("search").value.toLowerCase();
  let query = raw.replace(/[^0-9]/g, '').substring(0,8);

  let matches = HTS_DATA.filter(item =>
    (query && item.hts.startsWith(query)) ||
    item.description.toLowerCase().includes(raw)
  ).slice(0,10);

  let div = document.getElementById("results");
  div.innerHTML = "";

  matches.forEach(item => {
    let el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<strong>${item.originalHTS}</strong><br><small>${item.description}</small>`;
    el.onclick = () => {
      selectedHTS = item;
      div.innerHTML = `<strong>Selected:</strong><br>${item.originalHTS}`;
    };
    div.appendChild(el);
  });
}

function calculate() {

  if (!selectedHTS) return alert("Select HTS");
  let country = document.getElementById("country").value;
  if (!country) return alert("Select Country");

  let cost = +document.getElementById("cost").value || 0;
  let units = +document.getElementById("units").value || 1;

  let freight = +document.getElementById("freight").value || 0;
  let brokerage = +document.getElementById("brokerage").value || 0;
  let other = +document.getElementById("other").value || 0;

  let metalPercent = +document.getElementById("metalPercent").value || 0;
  let productType = document.getElementById("productType").value;
  let usMaterial = document.getElementById("usMaterial").value;

  let general = selectedHTS.duty;
  let section301 = country === "CN" ? get301Rate(selectedHTS.hts) : 0;

  let section232 = 0;
  if (metalPercent <= 15) section232 = 0;
  else if (usMaterial === "yes") section232 = 10;
  else if (productType === "industrial") section232 = 15;
  else if (productType === "derivative") section232 = 25;
  else if (productType === "raw") section232 = 50;

  let section122 = section232 > 0 ? 0 : 10;

  let totalRate = general + section301 + section232 + section122;

  // DUTY BREAKOUT
  let dutyGeneral = cost * (general / 100);
  let duty301 = cost * (section301 / 100);
  let duty232 = cost * (section232 / 100);
  let duty122 = cost * (section122 / 100);

  let totalDuty = dutyGeneral + duty301 + duty232 + duty122;

  let logistics = (freight + brokerage + other) / units;
  let landed = cost + totalDuty + logistics;

  document.getElementById("output").innerHTML = `
    <div class="sub">${selectedHTS.originalHTS}</div>

    <div class="big">$${landed.toFixed(2)}</div>
    <div class="sub">TRUE Landed Cost per Unit</div>

    <hr>

    <strong>Tariff Rates</strong><br>
    General: ${general}%<br>
    Section 301: ${section301}%<br>
    Section 232: ${section232}%<br>
    Section 122: ${section122}% ${section232 > 0 ? "(Excluded due to 232)" : ""}<br>

    <hr>

    <strong>Duty Breakdown ($)</strong><br>
    General: $${dutyGeneral.toFixed(2)}<br>
    301: $${duty301.toFixed(2)}<br>
    232: $${duty232.toFixed(2)}<br>
    122: $${duty122.toFixed(2)}<br>

    <hr>

    <strong>Total Duty:</strong> $${totalDuty.toFixed(2)}<br>
    Logistics/unit: $${logistics.toFixed(2)}
  `;
}

// MODAL
function open232(){ document.getElementById("modal232").style.display="block"; }
function close232(){ document.getElementById("modal232").style.display="none"; }
window.onclick = e => {
  let m=document.getElementById("modal232");
  if(e.target===m) m.style.display="none";
};

</script>

</body>
</html>
